# mcp-multi-model 配置文件示例
# 复制为 config.yaml 后,把对应 *_API_KEY 写到 .env 即可启动。未配 key 的模型启动时自动跳过。
# 模型清单与 README 对齐 (DeepSeek V4 / Gemini 3.x / OpenAI GPT-6 + GPT-5.6 / Nano Banana 2 / Veo 3.1);如需新增模型,在 models 下加一条即可。
# adapter 三种:openai(Chat Completions 兼容)/ gemini / openai-responses(OpenAI Responses API,联网 web_search)。

defaults:
  max_tokens: 4000
  temperature: 0.7
  timeout_ms: 60000
  max_retries: 2

models:
  # === DeepSeek V4 ===
  deepseek:
    name: DeepSeek
    adapter: openai
    endpoint: https://api.deepseek.com/chat/completions
    api_key_env: DEEPSEEK_API_KEY
    model: deepseek-v4-flash
    description: "DeepSeek V4 Flash 默认入口。1M context,擅长代码+中文+数学逻辑,成本极低。"
    pricing:
      input: 0.14    # $0.14/M cache miss
      output: 0.28   # $0.28/M

  deepseek-pro:
    name: DeepSeek Pro
    adapter: openai
    endpoint: https://api.deepseek.com/chat/completions
    api_key_env: DEEPSEEK_API_KEY
    model: deepseek-v4-pro
    description: "DeepSeek V4 Pro 高难度推理。1M context,支持思考模式。"
    force_non_streaming: true   # 思考模型流式 delta 只走 reasoning_content,易被 token 预算耗尽导致 content 为空;非流式 message.content 正常
    pricing:
      input: 0.435   # $0.435/M cache miss
      output: 0.87   # $0.87/M

  # === OpenAI GPT-5.6 (2026-07-09 GA,三档:Sol 旗舰 / Terra 中档 / Luna 廉价) ===
  # ⚠️ 全系锁 temperature=1,必须 reasoning:true(server 对 reasoning 模型跳过 temperature/top_p)。
  openai:
    name: OpenAI
    adapter: openai
    endpoint: https://api.openai.com/v1/chat/completions
    api_key_env: OPENAI_API_KEY
    model: gpt-5.6-luna
    description: "GPT-5.6 Luna 默认 OpenAI 入口。廉价快速档(2026-07-30 降价 80%),ask_all 第 4 视角识别其他模型偏置。"
    reasoning: true   # GPT-5.6 全系锁 temperature=1,本 flag 让 server 跳过自动设 temperature/top_p
    pricing:
      input: 0.20    # 2026-07-30 起 $0.20/M(原 $1)
      output: 1.20   # 2026-07-30 起 $1.20/M(原 $6)

  openai-pro:
    name: OpenAI Pro
    adapter: openai
    endpoint: https://api.openai.com/v1/chat/completions
    api_key_env: OPENAI_API_KEY
    model: gpt-6-astra
    description: "GPT-6 Astra 旗舰(2026-09-03 发布,1.05M context,128K 输出)。复杂 reasoning / agentic coding / 多模态视觉显式调用;ask_all 里的 OpenAI 旗舰视角。$10/$50。"
    reasoning: true   # GPT-6 Astra 锁 temperature=1(实测 400 "Only the default (1) value is supported");且必须 max_completion_tokens(index.js 正则已含 gpt-6)
    pricing:
      input: 10.00   # GPT-6 Astra $10/M(cached $1;>272K 输入 $20)。备注:GPT-5.6 Sol 现 $4/$20 促销至 2026-11-21,若嫌贵可切回 gpt-5.6-sol
      output: 50.00  # $50/M(>272K 输入时 $75)

  # === OpenAI 联网取证(Responses API + web_search tool,adapter: openai-responses)===
  # Chat Completions 不支持 web_search(只有 gpt-5-search-api 专用模型),正经联网走 /v1/responses。
  # 费用 = 模型 token + $10/1K 次搜索(pricing.web_search_call=0.01),搜索内容按模型 token 计价。
  # `ask_all: false`:联网按次计费且慢,不进 ask_all,显式 ask_ai(model=...) / ask_both 调用。
  # 可选:search_context_size low|medium|high / allowed_domains / blocked_domains / tool_choice required / reasoning_effort / web_search_sources / timeout_ms
  openai-search:
    name: OpenAI Search
    adapter: openai-responses
    endpoint: https://api.openai.com/v1/responses
    api_key_env: OPENAI_API_KEY
    model: gpt-5.6-luna
    description: "GPT-5.6 Luna + OpenAI web search (Responses API), returns source URLs. Cheap evidence-gathering / realtime view, ~$0.02-0.05 per question."
    reasoning: true
    features:
      - web_search
    search_context_size: medium
    ask_all: false
    pricing:
      input: 0.20
      output: 1.20
      web_search_call: 0.01   # $10 per 1K search calls

  openai-pro-search:
    name: OpenAI Pro Search
    adapter: openai-responses
    endpoint: https://api.openai.com/v1/responses
    api_key_env: OPENAI_API_KEY
    model: gpt-6-astra
    description: "GPT-6 Astra + web search, reasoning high, search_context_size high. Deep evidence for high-stakes decisions; a single question can cost $0.3-1."
    reasoning: true
    reasoning_effort: high
    features:
      - web_search
    search_context_size: high
    timeout_ms: 180000   # deep reasoning + multi-round search often exceeds the global 60s
    ask_all: false
    pricing:
      input: 10.00
      output: 50.00
      web_search_call: 0.01

  # === Gemini 3.x ===
  gemini:
    name: Gemini
    adapter: gemini
    endpoint: https://generativelanguage.googleapis.com/v1beta
    api_key_env: GEMINI_API_KEY
    model: gemini-3.8-flash
    description: "Gemini 3.8 Flash 默认入口(2026-09-02 GA,1M context,thinking low/medium/high)。Google Search 联网,日常调研/创意首选。"
    features:
      - google_search
    pricing:
      input: 0.75    # intro 价至 2026-12-31;2027-01-01 起 $1.50(届时重估是否切回更便宜档)
      output: 3.75   # intro 价;2027-01-01 起 $7.50。thinking token 计入 output

  gemini-pro:
    name: Gemini Pro
    adapter: gemini
    endpoint: https://generativelanguage.googleapis.com/v1beta
    api_key_env: GEMINI_API_KEY
    model: gemini-3.1-pro-preview
    description: "Gemini 3.1 Pro Preview,重要调研 / 深度分析 / 长文档显式调用。Google Search 联网。>200K context 价格 2x。注:2026-09-09 核,Google 仍无 GA 的 Pro 后继(3.5-3.8 只出 Flash)。"
    features:
      - google_search
    pricing:
      input: 2.00
      output: 12.00

  nano-banana:
    name: Nano Banana 2 (Gemini 3.1 Flash Image)
    adapter: gemini
    endpoint: https://generativelanguage.googleapis.com/v1beta
    api_key_env: GEMINI_API_KEY
    model: gemini-3.1-flash-image   # 2026-09-09 切 GA ID(preview 仍在但迟早下线),价格不变
    description: "Gemini 3.1 Flash Image (Nano Banana 2)。多模态图像编辑首选,支持参考图输入。"
    image_generation: true
    pricing:
      input: 0.0
      output: 0.067   # $/1K image, 4K 时为 0.151

  nano-banana-pro:
    name: Nano Banana Pro (Gemini 3 Pro Image)
    adapter: gemini
    endpoint: https://generativelanguage.googleapis.com/v1beta
    api_key_env: GEMINI_API_KEY
    model: gemini-3-pro-image   # 2026-09-09 切 GA ID,价格不变
    description: "Gemini 3 Pro Image (Nano Banana Pro)。Pro reasoning + 4K + Gemini 上下文整合。需要旗舰多模态/复杂 prompt 理解时显式调。"
    image_generation: true
    pricing:
      input: 0.0
      output: 0.134   # $/1K image, 4K 时为 0.24

  # === OpenAI GPT Image 2 (备胎,文字渲染/复杂指令理解强项) ===
  # 用武之地:Imagen 字渲染歪 / 复杂构图理解失败时显式调
  # Nano Banana 2 Lite (2026-09-09 加):Imagen 4 全系被 Google 下线(imagen-4.0-* 三个 ID v1/v1beta 全 404,
  # ListModels 也没有)后接任「日常出图默认」。官方 $30/M image tokens ≈ $0.0336/1K 图(Batch 半价)。
  nano-banana-lite:
    name: Nano Banana 2 Lite (Gemini 3.1 Flash Lite Image)
    adapter: gemini
    endpoint: https://generativelanguage.googleapis.com/v1beta
    api_key_env: GEMINI_API_KEY
    model: gemini-3.1-flash-lite-image
    description: "Nano Banana 2 Lite 默认图像生成。~$0.034/1K 图,超低延迟,日常出图/头像/原型图。要参考图编辑用 nano-banana,要 4K 旗舰用 nano-banana-pro,要极致文字渲染用 gpt-image。"
    image_generation: true
    pricing:
      input: 0.0
      output: 0.0336   # $/1K image (官方 $30/M image tokens)

  gpt-image:
    name: GPT Image 2
    adapter: openai
    endpoint: https://api.openai.com/v1/chat/completions   # 内部 swap 为 /v1/images/generations
    api_key_env: OPENAI_API_KEY
    model: gpt-image-2
    description: "GPT Image 2 medium quality。文字渲染/复杂指令理解优于 Imagen,适合带字海报/复杂构图。"
    image_generation: true
    default_quality: medium
    default_size: "1024x1024"
    pricing:
      input: 0.0
      output: 0.053   # $/image @ medium 1024x1024

  gpt-image-hd:
    name: GPT Image 2 HD
    adapter: openai
    endpoint: https://api.openai.com/v1/chat/completions
    api_key_env: OPENAI_API_KEY
    model: gpt-image-2
    description: "GPT Image 2 high quality。旗舰图像生成,需要最强文字+构图时显式调。"
    image_generation: true
    default_quality: high
    default_size: "1024x1024"
    pricing:
      input: 0.0
      output: 0.211

  # === 视频生成 (Veo 3.1 preview) ===
  gemini-video:
    name: Gemini Video (Veo)
    adapter: gemini
    endpoint: https://generativelanguage.googleapis.com/v1beta
    api_key_env: GEMINI_API_KEY
    model: veo-3.1-generate-preview
    video_generation: true
    description: "Google Veo 3.1 视频生成。最长 8 秒(限制为偶数:4/6/8),原生音频。注:旧 veo-3.0-generate-001 已下线。"
    pricing:
      input: 0.0
      output: 0.0

  # === Kimi (Moonshot) ===
  # 2026-09-09 迁移:moonshot-v1 全系列已下线(API 404),联网入口改 kimi-k2.6。
  # 为什么不是 K3:官方文档明示"$web_search 正在更新升级中,近期不建议使用",实测 K3 第二轮回传
  # 一律 400 "tokenization failed"(换查询/关 thinking 都一样);K3 联网官方推荐走 Formula API
  # "官方工具"通道(标准 function tool,另一套协议,本 server 未实现)。K2.6 + $web_search 走现有
  # tool loop 实测通过,且便宜 3-4x。K2.6 若再下线,重测 K3 联网或实现官方工具通道。
  # K2.6 是思考模型:temperature 只允许 1 → reasoning:true 让 server 跳过 temperature/top_p。
  # 走 .cn 端点(¥ 计价),pricing 按 ¥ ÷ 7.1 折算 USD。现役型号查: GET /v1/models
  kimi:
    name: Kimi
    adapter: openai
    endpoint: https://api.moonshot.cn/v1/chat/completions
    api_key_env: KIMI_API_KEY
    model: kimi-k2.6
    description: "向 Kimi K2.6 发送请求(内置联网搜索)。擅长:中文联网搜索、实时信息、国内资讯。"
    system_prefix: "你是 Kimi,擅长联网搜索。当用户的问题涉及实时信息、最新数据、当前时间日期等内容时,请主动使用联网搜索工具获取最新结果。"
    reasoning: true   # K2.6 锁 temperature=1/top_p=0.95
    features:
      - web_search
    tool_loop_max: 5
    pricing:
      input: 0.92    # ¥6.50/M cache miss ≈ $0.92 (cache hit ¥1.10/M ≈ $0.15)
      output: 3.80   # ¥27/M ≈ $3.80

  # K2.7 Code 入口 (2026-07-12 加,非默认;2026-09-09 核:K2.6 仍在役并重新担任联网入口,见上):
  # 对比 K2.6:同 262K context + 多模态(图/视频),同价(¥6.50/¥27),agentic coding 更强。
  # 不开 web_search:code 用途无需联网,且可避开 K2.7「多步 tool call 必须回传 reasoning_content」的新约束
  # (该约束我们 tool loop 未实现)。联网搜索仍走默认 v1-32k(kimi)。
  # reasoning:true 处理 API 锁的 temperature=1/top_p=0.95(server 对 reasoning 模型跳过这两个参数)。
  # 编程默认仍用 DeepSeek,此为显式备选: ask_kimi_k27_code(...) 或 ask_ai(model="kimi_k27_code", ...)
  kimi_k27_code:
    name: Kimi K2.7 Code
    adapter: openai
    endpoint: https://api.moonshot.cn/v1/chat/completions
    api_key_env: KIMI_API_KEY
    model: kimi-k2.7-code
    description: "Kimi K2.7 Code (备用,编程+多模态)。262K context,agentic coding 最强,支持图/视频输入,thinking 模式。编程默认仍用 DeepSeek,此为显式备选。"
    reasoning: true   # K2.7 锁 temperature=1/top_p=0.95,本 flag 让 server 对 reasoning 模型跳过自动设这两个参数
    pricing:
      input: 0.92    # ¥6.50/M cache miss ≈ $0.92 (cache hit ¥1.30/M ≈ $0.18)
      output: 3.80   # ¥27/M ≈ $3.80

  # K3 入口 (2026-09-09 加,非默认):Moonshot 旗舰,2.8T 参数开源权重,1M context,原生视觉,
  # 始终思考(不可关),temperature=1/top_p=0.95 锁死 → reasoning:true。顶层 reasoning_effort
  # low/high/max 默认 max(本 server 未透传,默认即 max,输出偏贵:¥100/M)。
  # 不开 web_search(见 kimi 段说明)。定位:ask_all 里的中国旗舰视角 / 高难度推理显式调用。
  # .cn 需充值解锁旗舰(本账号已解锁,2026-09-09 实测 200)。
  kimi_k3:
    name: Kimi K3
    adapter: openai
    endpoint: https://api.moonshot.cn/v1/chat/completions
    api_key_env: KIMI_API_KEY
    model: kimi-k3
    description: "Kimi K3 (Moonshot 旗舰,2.8T 开源权重,1M context,始终思考,支持图片输入)。高难度推理/长文档/中国旗舰视角对比用;不联网,联网用 ask_kimi。"
    reasoning: true          # 锁 temperature=1/top_p=0.95
    force_non_streaming: true  # 思考模型流式 delta.content 长期为空,非流式读 message.content
    pricing:
      input: 2.82    # ¥20/M cache miss ≈ $2.82 (cache hit ¥2/M ≈ $0.28)
      output: 14.08  # ¥100/M ≈ $14.08

# 委派路由配置
# fallback_chain: 当 delegate_to 的 API key 缺失时,按顺序尝试备选 chat 模型;全缺则回落到顶层 fallback
routing:
  fallback: deepseek
  categories:
    research:
      keywords: [调研, 分析, 对比, 竞品, 方案, 综述, 梳理, survey, research, compare, analysis, "pros and cons", review]
      delegate_to: gemini
      fallback_chain: [openai, deepseek, kimi]
      reason: "Gemini 3 Flash + Google Search 联网,日常调研足够;深度调研显式调 gemini-pro"
    code:
      keywords: [算法, 代码, 实现, 函数, 重构, 生成代码, 数学, 推导, 公式, algorithm, implement, code, math, function, refactor]
      delegate_to: deepseek
      fallback_chain: [openai, gemini, kimi]
      reason: "DeepSeek V4 Flash 擅长代码与数学,1M context,极低成本;高难度任务显式调 deepseek-pro"
    realtime:
      keywords: [最新, 实时, 今天, 最近, 新闻, 热搜, 价格, 天气, 股价, 汇率, current, latest, today, news, price]
      delegate_to: kimi
      fallback_chain: [gemini, openai, deepseek]
      reason: "Kimi 擅长中文联网搜索,获取国内实时信息"
    creative:
      keywords: [写作, 文案, 起名, 标题, slogan, 营销, 故事, creative, writing, copywriting, brainstorm]
      delegate_to: gemini
      fallback_chain: [openai, deepseek, kimi]
      reason: "Gemini 3 Flash 创意写作能力强"

# 特殊工具配置
tools:
  translate:
    model: deepseek
    description: "DeepSeek V4 Flash 中英互译,质量高成本低。"
  research:
    model: gemini
    description: "Gemini 3 Flash 调研(已联网)。"
  generate_image:
    model: nano-banana-lite
    description: "Nano Banana 2 Lite 默认图像生成(~$0.034/图)。参考图编辑用 nano-banana,4K 旗舰用 nano-banana-pro,极致文字渲染用 gpt-image。Imagen 4 已被 Google 下线。"
  generate_video:
    model: gemini-video
    description: "Veo 3.x 视频生成(异步,最长 8 秒,4/6/8 偶数限制)。"
